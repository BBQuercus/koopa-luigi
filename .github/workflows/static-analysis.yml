# Static checks only (no pipeline run, no TensorFlow/GPU environments).
# Fails on new dead code (vulture), dependency drift (deptry) or duplication above the baseline in
# .jscpd.json (jscpd). Same check locally: make lint-dead
name: Static analysis

on: [push, pull_request]

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.10"
      # setup-uv already created and activated .venv. Light install: koopa without its extras.
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Dead code (vulture)
        run: .venv/bin/python -m vulture
      - name: Dependencies (deptry)
        run: .venv/bin/python -m deptry .
      # jscpd reads .jscpd.json (threshold = today's duplication rounded up to the next 0.5 %).
      - name: Duplicates (jscpd)
        run: npx --yes jscpd@5.4.3
