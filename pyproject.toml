[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "koopa-luigi"
version = "0.1.1"
description = "Luigi-based workflow for smFISH image analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Bastian Eichenberger", email = "bastian@eichenbergers.ch" }]
keywords = ["biomedical", "bioinformatics", "image analysis", "smFISH", "microscopy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "koopa",
    "luigi>=3.0",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "deptry==0.25.1",
    "pytest",
    "pytest-cov",
    "vulture==2.16",
]

[project.scripts]
koopa-luigi = "src.cli:main"

[project.urls]
Homepage = "https://github.com/BBQuercus/koopa-luigi"
Documentation = "https://github.com/BBQuercus/koopa-luigi/blob/main/README.md"
Changelog = "https://github.com/BBQuercus/koopa-luigi/releases"
Issues = "https://github.com/BBQuercus/koopa-luigi/issues"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Dead-code check (CI workflow static-analysis.yml); run locally with `make lint-dead`.
# Luigi finds tasks by name (koopa.cfg, shell scripts), so task classes and their hooks count as used.
[tool.vulture]
paths = ["src", "tests", "vulture_whitelist.py"]
min_confidence = 60
ignore_decorators = ["@pytest.fixture"]
ignore_names = ["run", "requires", "output", "complete"]

# Unused / missing dependency check, same CI workflow.
[tool.deptry]
known_first_party = ["src"]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# Baseline: provided by requirements_legacy.txt / requirements_modern.txt (TF/torch differ per env),
# not by pyproject.toml.
DEP001 = ["deepblink", "keras", "tensorflow", "torch"]
DEP003 = ["numpy", "pandas", "scipy", "skimage"]
